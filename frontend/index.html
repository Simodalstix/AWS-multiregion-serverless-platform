<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless E-commerce Demo</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .config { background: #f5f5f5; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .product { border: 1px solid #ddd; padding: 15px; border-radius: 5px; }
        .cart { position: fixed; top: 20px; right: 20px; background: white; border: 2px solid #007bff; padding: 15px; border-radius: 5px; min-width: 200px; }
        .btn { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 3px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .status { margin: 10px 0; padding: 10px; border-radius: 3px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛒 Serverless E-commerce Platform</h1>
        <p>Multi-region, event-driven e-commerce built on AWS</p>
    </div>

    <div class="config">
        <label>API Endpoint:</label>
        <input type="text" id="apiEndpoint" placeholder="https://your-api.execute-api.region.amazonaws.com/prod" style="width: 500px; margin: 0 10px;">
        <button class="btn" onclick="loadProducts()">Load Products</button>
    </div>

    <div class="cart">
        <h3>🛒 Cart</h3>
        <div id="cartItems"></div>
        <div id="cartTotal">Total: $0.00</div>
        <button class="btn" onclick="checkout()" style="width: 100%; margin-top: 10px;">Checkout</button>
    </div>

    <div id="status"></div>
    <div id="products" class="products"></div>

    <script>
        let cart = [];
        let products = [];

        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.innerHTML = `<div class="status ${type}">${message}</div>`;
            setTimeout(() => status.innerHTML = '', 3000);
        }

        async function loadProducts() {
            const endpoint = document.getElementById('apiEndpoint').value;
            if (!endpoint) {
                showStatus('Please enter API endpoint', 'error');
                return;
            }

            try {
                const response = await fetch(`${endpoint}/products`);
                const data = await response.json();
                products = data.products || [];
                displayProducts();
                showStatus(`Loaded ${products.length} products`);
            } catch (error) {
                showStatus(`Error loading products: ${error.message}`, 'error');
            }
        }

        function displayProducts() {
            const container = document.getElementById('products');
            container.innerHTML = products.map(product => `
                <div class="product">
                    <h3>${product.name}</h3>
                    <p>${product.description}</p>
                    <p><strong>$${product.price}</strong> | ${product.category}</p>
                    <button class="btn" onclick="addToCart('${product.productId}')">Add to Cart</button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.productId === productId);
            if (!product) return;

            const existingItem = cart.find(item => item.productId === productId);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartDisplay();
            showStatus(`Added ${product.name} to cart`);
        }

        function updateCartDisplay() {
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            
            cartItems.innerHTML = cart.map(item => `
                <div>${item.name} x${item.quantity} - $${(item.price * item.quantity).toFixed(2)}</div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotal.innerHTML = `Total: $${total.toFixed(2)}`;
        }

        async function checkout() {
            const endpoint = document.getElementById('apiEndpoint').value;
            if (!endpoint || cart.length === 0) {
                showStatus('Add items to cart first', 'error');
                return;
            }

            try {
                // Create order
                const orderData = {
                    customerId: 'demo-customer',
                    items: cart.map(item => ({
                        id: item.productId,
                        quantity: item.quantity,
                        price: item.price
                    }))
                };

                const orderResponse = await fetch(`${endpoint}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                const order = await orderResponse.json();
                
                if (order.orderId) {
                    // Process payment
                    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                    const paymentResponse = await fetch(`${endpoint}/payments`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            orderId: order.orderId,
                            amount: total,
                            currency: 'USD',
                            paymentMethod: 'card'
                        })
                    });

                    const payment = await paymentResponse.json();
                    
                    if (payment.success) {
                        showStatus(`Order ${order.orderId} completed successfully! 🎉`);
                        cart = [];
                        updateCartDisplay();
                    } else {
                        showStatus(`Payment failed: ${payment.error}`, 'error');
                    }
                } else {
                    showStatus('Order creation failed', 'error');
                }
            } catch (error) {
                showStatus(`Checkout error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
